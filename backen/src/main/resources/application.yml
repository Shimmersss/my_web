server:
  # The public entry point is Nginx/ESA/Tunnel. Keep the application socket
  # loopback-only so port 8080 cannot become an origin-bypass path.
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080

spring:
  datasource:
    # 本地默认 H2；生产请通过 DB_URL/DB_USERNAME/DB_PASSWORD 指向 MySQL
    url: ${DB_URL:jdbc:h2:mem:webdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:6}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

zotero:
  # 在 https://www.zotero.org/settings/keys 申请
  api-key: ${ZOTERO_API_KEY:}
  # 在 https://www.zotero.org/settings/keys 顶部可见
  user-id: ${ZOTERO_USER_ID:}
  base-url: https://api.zotero.org
  # Zotero API 单页最大 100；全量分页仍设置硬上限，避免异常上游拖垮 2C/4G 主机
  sync-page-size: ${ZOTERO_SYNC_PAGE_SIZE:100}
  max-items: ${ZOTERO_MAX_ITEMS:10000}
  max-collections: ${ZOTERO_MAX_COLLECTIONS:5000}

admin:
  # 后台管理密钥，用于管理 GitHub 开源项目展示列表
  key: ${ADMIN_KEY:change-me}

auth:
  root-username: ${ROOT_USERNAME:root}
  root-password: ${ROOT_PASSWORD:}
  session-days: ${AUTH_SESSION_DAYS:30}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}

llm:
  # Anthropic Messages API（支持 Claude 模型）
  api-url: ${LLM_API_URL:https://token-plan-cn.xiaomimimo.com/anthropic}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:mimo-v2.5-pro}
  max-tokens: ${LLM_MAX_TOKENS:8192}
  # 每段文本最大字符数，超长段落会按句号拆分后分批翻译
  chunk-size: ${LLM_CHUNK_SIZE:6000}
  connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:20}
  read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:180}
  vision-image-max-bytes: ${LLM_VISION_IMAGE_MAX_BYTES:4194304}
  vision-batch-max-bytes: ${LLM_VISION_BATCH_MAX_BYTES:16777216}
  vision-image-max-pixels: ${LLM_VISION_IMAGE_MAX_PIXELS:4000000}
  vision-max-tokens: ${LLM_VISION_MAX_TOKENS:12000}

babeldoc:
  # 排版版 PDF 由 BabelDOC CLI 生成；首次运行 uvx 会自动下载运行时和模型资源
  enabled: ${BABELDOC_ENABLED:true}
  command: ${BABELDOC_COMMAND:uv run --with babeldoc python}
  openai-base-url: ${BABELDOC_OPENAI_BASE_URL:https://token-plan-cn.xiaomimimo.com/v1}
  openai-api-key: ${BABELDOC_OPENAI_API_KEY:${LLM_API_KEY:}}
  openai-model: ${BABELDOC_OPENAI_MODEL:mimo-v2.5-pro}
  timeout-seconds: ${BABELDOC_TIMEOUT_SECONDS:21600}
  qps: ${BABELDOC_QPS:2}
  resource-cgroup-limit-mi-b: ${BABELDOC_RESOURCE_CGROUP_LIMIT_MIB:2600}
  resource-min-available-mi-b: ${BABELDOC_RESOURCE_MIN_AVAILABLE_MIB:400}
  resource-max-swap-used-mi-b: ${BABELDOC_RESOURCE_MAX_SWAP_USED_MIB:1200}
  max-pages-per-chunk: ${BABELDOC_MAX_PAGES_PER_CHUNK:5}
  resource-recovery-timeout-seconds: ${BABELDOC_RESOURCE_RECOVERY_TIMEOUT_SECONDS:120}

translation:
  # 2 核 / 4 GB 服务器只运行一个 BabelDOC 子进程，结果落盘避免长期占用 JVM 堆
  storage-dir: ${TRANSLATION_STORAGE_DIR:../.run/translation-tasks}
  max-history: ${TRANSLATION_MAX_HISTORY:5}
  max-global-history: ${TRANSLATION_MAX_GLOBAL_HISTORY:20}
  queue-capacity: ${TRANSLATION_QUEUE_CAPACITY:5}
  max-qps: ${TRANSLATION_MAX_QPS:4}
  stable-qps: ${TRANSLATION_STABLE_QPS:2}

image-generation:
  # 独立生图节目使用单 worker；任务图片与 PPT 任务完全分目录保存
  storage-dir: ${IMAGE_GENERATION_STORAGE_DIR:../.run/image-generation-tasks}
  max-history: ${IMAGE_GENERATION_MAX_HISTORY:5}
  max-global-history: ${IMAGE_GENERATION_MAX_GLOBAL_HISTORY:20}
  queue-capacity: ${IMAGE_GENERATION_QUEUE_CAPACITY:3}
  timeout-seconds: ${IMAGE_GENERATION_TIMEOUT_SECONDS:240}
  max-reference-bytes: ${IMAGE_GENERATION_MAX_REFERENCE_BYTES:20971520}
  max-output-bytes: ${IMAGE_GENERATION_MAX_OUTPUT_BYTES:12582912}
  max-reference-pixels: ${IMAGE_GENERATION_MAX_REFERENCE_PIXELS:16000000}

ppt-generation:
  # 公开 PPT 生成入口保持资源保守：单 worker、有界队列、文件落盘
  storage-dir: ${PPT_GENERATION_STORAGE_DIR:../.run/ppt-generation-tasks}
  max-history: ${PPT_GENERATION_MAX_HISTORY:5}
  max-global-history: ${PPT_GENERATION_MAX_GLOBAL_HISTORY:20}
  queue-capacity: ${PPT_GENERATION_QUEUE_CAPACITY:3}
  max-prompt-chars: ${PPT_GENERATION_MAX_PROMPT_CHARS:8000}
  max-paper-bytes: ${PPT_GENERATION_MAX_PAPER_BYTES:31457280}
  max-template-bytes: ${PPT_GENERATION_MAX_TEMPLATE_BYTES:31457280}
  max-paper-text-chars: ${PPT_GENERATION_MAX_PAPER_TEXT_CHARS:28000}
  max-extracted-images: ${PPT_GENERATION_MAX_EXTRACTED_IMAGES:24}
  max-archive-entries: ${PPT_GENERATION_MAX_ARCHIVE_ENTRIES:2000}
  max-archive-uncompressed-bytes: ${PPT_GENERATION_MAX_ARCHIVE_UNCOMPRESSED_BYTES:125829120}
  max-archive-entry-bytes: ${PPT_GENERATION_MAX_ARCHIVE_ENTRY_BYTES:33554432}
  max-archive-compression-ratio: ${PPT_GENERATION_MAX_ARCHIVE_COMPRESSION_RATIO:120}
  agent-command: ${PPT_GENERATION_AGENT_COMMAND:node}
  agent-node-max-old-space-mb: ${PPT_GENERATION_AGENT_NODE_MAX_OLD_SPACE_MB:384}
  vision-model: ${PPT_GENERATION_VISION_MODEL:mimo-v2.5}
  soffice-command: ${PPT_GENERATION_SOFFICE_COMMAND:soffice}
  pdftoppm-command: ${PPT_GENERATION_PDFTOPPM_COMMAND:pdftoppm}
  # 本机未配置时由固定 Node 渲染器按平台选择 Chrome；生产部署显式设置 /usr/bin/chromium
  chrome-command: ${PPT_GENERATION_CHROME_COMMAND:}
  paper-parser-command: ${PPT_GENERATION_PAPER_PARSER_COMMAND:uv run --with docling --with markitdown python}
  paper-parser-script: ${PPT_GENERATION_PAPER_PARSER_SCRIPT:./scripts/ppt_document_parser.py}
  codex-command: ${PPT_GENERATION_CODEX_COMMAND:./node_modules/.bin/codex}
  codex-vendor-root: ${PPT_GENERATION_CODEX_VENDOR_ROOT:../vendor/open-kimi-ppt-skill}
  codex-finalize-script: ${PPT_GENERATION_CODEX_FINALIZE_SCRIPT:./scripts/ppt-codex/finalize.mjs}
  codex-html-skill-root: ${PPT_GENERATION_CODEX_HTML_SKILL_ROOT:../.agents/skills/create-html-presentation}
  codex-html-finalize-script: ${PPT_GENERATION_CODEX_HTML_FINALIZE_SCRIPT:./scripts/ppt-agent/finalize-html-plan.mjs}
  visual-prefetch-script: ${PPT_GENERATION_VISUAL_PREFETCH_SCRIPT:./scripts/ppt-agent/prefetch-visual-assets.mjs}
