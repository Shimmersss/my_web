<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b83126">
  <title>暂时无法连接 - 闪闪小站</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fbf9f3; color: #292922; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 440px); border-top: 4px solid #b83126; padding: 28px 0; }
    .mark { color: #b83126; font-size: 42px; line-height: 1; }
    h1 { margin: 18px 0 10px; font-size: 28px; letter-spacing: 0; }
    p { margin: 0 0 24px; color: #6d685f; line-height: 1.7; }
    button { min-height: 44px; border: 0; border-radius: 4px; padding: 0 20px; background: #b83126; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(184, 49, 38, .3); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>暂时无法连接</h1>
    <p>闪闪小站需要连接服务器才能使用文献、翻译、演示和生图功能。请检查网络后重试。</p>
    <button type="button" onclick="location.reload()">重新连接</button>
  </main>
</body>
</html>
