plugins {
    id 'com.android.application'
}

configurations.configureEach {
    // GeckoView 149 declares Kotlin 2.3.10, whose metadata is newer than the
    // Android Gradle Plugin's lint frontend can read. GeckoView only consumes
    // the stable stdlib ABI here, so keep the proven 2.2.0 runtime until AGP is
    // upgraded together with the rest of the Android toolchain.
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
}

def internalKeystorePath = System.getenv('SHIMMER_ANDROID_KEYSTORE')
def internalKeystorePassword = System.getenv('SHIMMER_ANDROID_STORE_PASSWORD')

android {
    compileSdkVersion 36
    namespace 'help.shimmer.app'

    signingConfigs {
        internal {
            if (internalKeystorePath && internalKeystorePassword) {
                storeFile file(internalKeystorePath)
                storePassword internalKeystorePassword
                keyAlias 'shimmer-internal'
                keyPassword internalKeystorePassword
            }
        }
    }

    defaultConfig {
        applicationId 'help.shimmer.app'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 12
        versionName '0.3.7-internal'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (!internalKeystorePath || !internalKeystorePassword) {
                throw new GradleException('Internal release signing credentials are not configured')
            }
            signingConfig signingConfigs.internal
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError true
        // GeckoView bundles ExoPlayer notification helpers, but this app never invokes
        // media notifications. Declaring/requesting notification access would broaden
        // permissions without enabling an app feature.
        disable 'NotificationPermission'
    }
}

dependencies {
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.mozilla.geckoview:geckoview-arm64-v8a:149.0.20260403140140'
    testImplementation 'junit:junit:4.13.2'
}
