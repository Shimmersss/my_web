name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backen/package-lock.json
            front/package-lock.json
      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-noto-cjk fontconfig
      - run: npm --prefix backen ci
      - run: npm --prefix front ci
      - run: mvn -B -f backen/pom.xml clean test
      - name: Verify real MySQL transactions and recovery
        env:
          WEB_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/mysql?useSSL=false&allowPublicKeyRetrieval=true
          WEB_TEST_MYSQL_USER: root
          WEB_TEST_MYSQL_PASSWORD: isolated-ci-test
        run: mvn -B -f backen/pom.xml -Dtest=MatchmakingMySqlIT test
      - run: python3 -m unittest discover -s deploy/tests
      - run: bash -n deploy/deploy-server-improved.sh
      - run: npm --prefix backen test
      - run: npm --prefix front run build
